spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/compute?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret}

providers:
  runpod:
    # No RunPod service ships with this repository, so the adapter stays out of the candidate pool
    # until someone points it at a real endpoint.
    enabled: ${RUNPOD_ENABLED:false}
    base-url: ${RUNPOD_BASE_URL:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
